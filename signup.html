<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SYSG</title>
<link rel="icon" type="image/svg+xml" href="./img/logo/favicon.png" id="faviconLink" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="./img/logo/favicon.png" />
<meta name="theme-color" content="#0071e3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
  if (localStorage.getItem("themeStyle") === "kitty") {
    document.documentElement.classList.add("theme-kitty");
    document.getElementById("faviconLink").href = "./img/logo/favicon.svg";
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="signup">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="index.html">SYSG</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link nav-link-custom" data-page="home" href="index.html">홈</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" data-page="board" href="board.html">게시판</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm" type="button" title="다크모드 전환">🌙</button>
        <button id="themeStyleToggleBtn" class="btn btn-outline-secondary btn-sm" type="button" title="테마 전환">🍎</button>
        <div id="authArea" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          <h4 class="fw-bold mb-3">회원가입</h4>

          <label class="form-label small">이메일</label>
          <input type="email" id="signupEmailInput" class="form-control mb-2" placeholder="이메일" />

          <label class="form-label small">비밀번호</label>
          <input type="password" id="signupPasswordInput" class="form-control mb-2" placeholder="비밀번호 (6자 이상)" />

          <label class="form-label small">닉네임</label>
          <input type="text" id="signupNameInput" class="form-control mb-2" placeholder="닉네임" />

          <label class="form-label small d-block">성별</label>
          <div class="d-flex gap-3 mb-2">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="gender" id="genderMale" value="남성" />
              <label class="form-check-label" for="genderMale">남성</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="여성" />
              <label class="form-check-label" for="genderFemale">여성</label>
            </div>
          </div>

          <label class="form-label small">전화번호</label>
          <input type="tel" id="signupPhoneInput" class="form-control mb-3" placeholder="010-0000-0000" />

          <button id="signupBtn" class="btn btn-primary w-100">회원가입</button>
          <p id="signupError" class="text-danger small mt-2 mb-0"></p>
          <hr />
          <p class="text-center small text-muted mb-0">
            이미 계정이 있으신가요? <a href="login.html">로그인</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="nav.js"></script>
<script type="module" src="push.js"></script>
<script type="module" src="theme.js"></script>
<script type="module" src="signup.js"></script>
</body>
</html>
