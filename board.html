<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SYSG</title>
<link rel="icon" type="image/svg+xml" href="./img/logo/favicon.png" id="faviconLink" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="./img/logo/favicon.png" />
<meta name="theme-color" content="#0071e3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
  if (localStorage.getItem("themeStyle") === "kitty") {
    document.documentElement.classList.add("theme-kitty");
    document.getElementById("faviconLink").href = "./img/logo/favicon.svg";
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="board">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="index.html">SYSG</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link nav-link-custom" data-page="home" href="index.html">홈</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" data-page="board" href="board.html">게시판</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm" type="button" title="다크모드 전환">🌙</button>
        <button id="themeStyleToggleBtn" class="btn btn-outline-secondary btn-sm" type="button" title="테마 전환">🍎</button>
        <div id="authArea" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </div>
</nav>

<div class="board-backdrop">
  <div class="container py-4">

    <div class="compose-card mb-4 mx-auto compose-card-wrap">
      <div class="compose-label">새 글 작성</div>
      <textarea id="postInput" class="form-control mb-2" rows="3" placeholder="무슨 생각을 하고 있나요?"></textarea>
      <button id="postBtn" class="btn btn-board">게시하기</button>
    </div>

    <div id="postList" class="note-grid"></div>

    <div id="paginationControls" class="d-flex justify-content-center align-items-center gap-3 mt-2">
      <button id="prevPageBtn" class="btn btn-note-outline" aria-label="이전 페이지">◀</button>
      <span id="pageIndicator" class="page-indicator"></span>
      <button id="nextPageBtn" class="btn btn-note-outline" aria-label="다음 페이지">▶</button>
    </div>

  </div>
</div>

<!-- 답변 모달: 채팅창 형태 -->
<div class="modal fade" id="replyModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content chat-modal">
      <div class="modal-header">
        <h6 class="modal-title mb-0" id="replyModalTitle">답변</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>
      <div class="modal-body chat-body" id="chatBody"></div>
      <div class="modal-footer chat-footer flex-column align-items-stretch">
        <div class="d-flex gap-3 mb-2 chat-visibility">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="replyVisibility" id="visPublic" value="public" checked />
            <label class="form-check-label" for="visPublic">전체공개</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="replyVisibility" id="visPrivate" value="private" />
            <label class="form-check-label" for="visPrivate">1:1 대화</label>
          </div>
        </div>
        <div class="mb-2 d-none" id="threadSelectWrap">
          <input
            type="text"
            id="threadSearchInput"
            class="form-control form-control-sm mb-1"
            placeholder="이름으로 검색..."
          />
          <div id="threadOptionsList" class="thread-options-list"></div>
          <div id="selectedThreadLabel" class="small mt-1 text-muted"></div>
        </div>
        <div class="d-flex gap-2">
          <input type="text" id="chatInput" class="form-control" placeholder="답변을 입력하세요..." />
          <button id="chatSendBtn" class="btn btn-primary">✈</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="nav.js"></script>
<script type="module" src="push.js"></script>
<script type="module" src="theme.js"></script>
<script type="module" src="board.js"></script>
</body>
</html>
