<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SYSG</title>
<link rel="icon" type="image/svg+xml" href="./img/logo/favicon.png" id="faviconLink" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="./img/logo/favicon.png" />
<meta name="theme-color" content="#0071e3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
  if (localStorage.getItem("themeStyle") === "kitty") {
    document.documentElement.classList.add("theme-kitty");
    document.getElementById("faviconLink").href = "./img/logo/favicon.svg";
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="home">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="index.html">SYSG</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link nav-link-custom" data-page="home" href="index.html">홈</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" data-page="board" href="board.html">게시판</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm" type="button" title="다크모드 전환">🌙</button>
        <button id="themeStyleToggleBtn" class="btn btn-outline-secondary btn-sm" type="button" title="테마 전환">🍎</button>
        <div id="authArea" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">

  <!-- 로그아웃 상태일 때만 보임 -->
  <div id="homeGuest" class="p-5 mb-4 bg-white rounded-4 shadow-sm text-center d-none">
    <h1 class="fw-bold mb-3">환영합니다</h1>
    <p class="text-muted mb-4">로그인 후 게시판에서 글을 작성하고, 프로필을 꾸며보세요.</p>
    <div class="d-flex justify-content-center gap-2">
      <a href="login.html" class="btn btn-primary px-4">로그인</a>
      <a href="signup.html" class="btn btn-outline-primary px-4">회원가입</a>
    </div>
  </div>

  <!-- 로그인 상태일 때만 보임: 내 정보 카드 -->
  <div id="homeUser" class="card shadow-sm border-0 rounded-4 mb-4 d-none">
    <div class="card-body p-4 d-flex align-items-center gap-3">
      <div class="flex-fill">
        <div id="homeName" class="fw-bold fs-5"></div>
        <div id="homeEmail" class="text-muted small"></div>
      </div>
      <div class="d-flex flex-column gap-2">
        <a href="board.html" class="btn btn-primary btn-sm">게시판 보기</a>
        <a href="profile.html" class="btn btn-outline-secondary btn-sm">내 정보 수정</a>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="nav.js"></script>
<script type="module" src="push.js"></script>
<script type="module" src="theme.js"></script>
<script type="module" src="index.js"></script>
</body>
</html>
