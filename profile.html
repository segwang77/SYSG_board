<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SYSG</title>
<link rel="icon" type="image/svg+xml" href="./img/logo/favicon.png" id="faviconLink" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="./img/logo/favicon.png" />
<meta name="theme-color" content="#0071e3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
  if (localStorage.getItem("themeStyle") === "kitty") {
    document.documentElement.classList.add("theme-kitty");
    document.getElementById("faviconLink").href = "./img/logo/favicon.svg";
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="profile">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="index.html">SYSG</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link nav-link-custom" data-page="home" href="index.html">홈</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" data-page="board" href="board.html">게시판</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm" type="button" title="다크모드 전환">🌙</button>
        <button id="themeStyleToggleBtn" class="btn btn-outline-secondary btn-sm" type="button" title="테마 전환">🍎</button>
        <div id="authArea" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <!-- 탭 메뉴 -->
      <ul class="nav nav-pills mb-3 justify-content-center" id="profileTabs">
        <li class="nav-item">
          <button class="nav-link active" data-tab="basic">기본 정보</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="password">비밀번호 변경</button>
        </li>
      </ul>

      <!-- 기본 정보 (닉네임) -->
      <div class="card shadow-sm border-0 rounded-4 tab-panel" data-tab-panel="basic">
        <div class="card-body p-4">
          <label class="form-label small d-block">이메일</label>
          <input type="text" id="emailDisplay" class="form-control mb-3" disabled />

          <label class="form-label small d-block">닉네임</label>
          <div class="input-group mb-1">
            <input type="text" id="displayNameInput" class="form-control" placeholder="닉네임" />
            <button id="checkNicknameBtn" class="btn btn-outline-secondary" type="button">중복 확인</button>
          </div>
          <p id="nicknameCheckMsg" class="small mb-3"></p>

          <button id="saveProfileBtn" class="btn btn-primary w-100">저장</button>
          <p id="profileMsg" class="small mt-2 mb-0"></p>
        </div>
      </div>

      <!-- 비밀번호 변경 -->
      <div class="card shadow-sm border-0 rounded-4 tab-panel d-none" data-tab-panel="password">
        <div class="card-body p-4">
          <label class="form-label small">현재 비밀번호</label>
          <input type="password" id="currentPasswordInput" class="form-control mb-2" placeholder="현재 비밀번호" />

          <label class="form-label small">새 비밀번호</label>
          <input type="password" id="newPasswordInput" class="form-control mb-2" placeholder="새 비밀번호 (6자 이상)" />

          <label class="form-label small">새 비밀번호 확인</label>
          <input type="password" id="confirmPasswordInput" class="form-control mb-3" placeholder="새 비밀번호 확인" />

          <button id="changePasswordBtn" class="btn btn-primary w-100">비밀번호 변경</button>
          <p id="passwordMsg" class="small mt-2 mb-0"></p>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="nav.js"></script>
<script type="module" src="push.js"></script>
<script type="module" src="theme.js"></script>
<script type="module" src="profile.js"></script>
</body>
</html>
