<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SYSG</title>
<link rel="icon" type="image/svg+xml" href="./img/logo/favicon.png" id="faviconLink" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="./img/logo/favicon.png" />
<meta name="theme-color" content="#0071e3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<script>
  if (localStorage.getItem("theme") === "dark") {
    document.documentElement.classList.add("dark-mode");
  }
  if (localStorage.getItem("themeStyle") === "kitty") {
    document.documentElement.classList.add("theme-kitty");
    document.getElementById("faviconLink").href = "./img/logo/favicon.svg";
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="login">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="index.html">SYSG</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link nav-link-custom" data-page="home" href="index.html">홈</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" data-page="board" href="board.html">게시판</a></li>>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm" type="button" title="다크모드 전환">🌙</button>
        <button id="themeStyleToggleBtn" class="btn btn-outline-secondary btn-sm" type="button" title="테마 전환">🍎</button>
        <div id="authArea" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          <h4 class="fw-bold mb-3">로그인</h4>
          <input type="email" id="loginEmailInput" class="form-control mb-2" placeholder="이메일" />
          <input type="password" id="loginPasswordInput" class="form-control mb-3" placeholder="비밀번호" />
          <button id="loginBtn" class="btn btn-primary w-100">로그인</button>
          <p id="loginError" class="text-danger small mt-2 mb-0"></p>
          <hr />
          <p class="text-center small text-muted mb-0">
            계정이 없으신가요? <a href="signup.html">회원가입</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="nav.js"></script>
<script type="module" src="push.js"></script>
<script type="module" src="theme.js"></script>
<script type="module" src="login.js"></script>
</body>
</html>
